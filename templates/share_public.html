{% extends "base.html" %}
{% block extra_head %}
    <meta property="og:title" content="{{ ballot.user.username }}'s Top 15 - {{ cycle.name }}">
    <meta property="og:description" content="Check out my Top 15 Malaysian osu! players!">
    <meta property="og:type" content="website">
    <!-- Add og:image here later if you have a site logo -->
{% endblock %}
{% block content %}
    <div style="text-align: center; margin-bottom: 30px;">
        <h2>{{ ballot.user.username }}'s Top 15</h2>
        <p style="color: #666;">Voting Cycle: {{ cycle.name }}</p>
    </div>

    <div style="max-width: 600px; margin: 0 auto;">
        {% for entry in entries %}
            <div style="display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee;">
                <div style="font-size: 1.5em; font-weight: bold; color: #007bff; width: 60px;">#{{ entry.rank_position }}</div>
                <img src="{{ entry.player.avatar_url }}" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 15px;">
                <div>
                    <strong style="font-size: 1.1em;">{{ entry.player.username }}</strong>
                    <div style="color: #666; font-size: 0.9em;">{{ entry.player.current_pp }}pp</div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
